<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Darslar</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">JP NihongoHub</a><a href="/dashboard.html">Kabinet</a></header><main class="container"><h1>Darslar</h1><div class="field"><label for="level">Daraja</label><select id="level"><option value="">Barchasi</option><option>N5</option><option>N4</option></select></div><div id="items" class="grid"></div></main><script src="/app.js"></script><script>async function load(){let l=document.getElementById("level").value,rows=await api("/api/lessons"+(l?"?level="+l:""));document.getElementById("items").innerHTML=rows.map(x=>`<article class="card"><span class="pill">${x.level}</span><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p><a class="btn" href="/lesson.html?id=${x.id}">Darsni ochish</a></article>`).join("")}document.getElementById("level").onchange=load;load().catch(e=>document.getElementById("items").textContent=e.message);</script></body></html>
